name: Nesil AI tests
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
  supabase-local:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0-beta.17
      - run: supabase init --force
      - name: Select an available local PostgreSQL port
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          import socket

          config = Path("supabase/config.toml")
          content = config.read_text()
          match = re.search(r"(?ms)(^\\[db\\]\\s*.*?^port\\s*=\\s*)\\d+", content)
          if not match:
              raise SystemExit("Could not find [db].port in Supabase config")

          with socket.socket() as sock:
              sock.bind(("0.0.0.0", 0))
              port = sock.getsockname()[1]

          config.write_text(content[:match.start()] + match.group(1) + str(port) + content[match.end():])
          print(f"Using available local PostgreSQL port: {port}")
          PY
      - name: Disable local email confirmation for synthetic Auth users
        run: python -c "from pathlib import Path; p=Path('supabase/config.toml'); s=p.read_text(); p.write_text(s.replace('enable_confirmations = true','enable_confirmations = false'))"
      - run: supabase start -x studio,logflare,vector,edge-runtime,postgres-meta,supavisor,realtime,imgproxy
      - run: supabase test db
      - name: Export ephemeral local API settings
        run: |
          python - <<'PY'
          import os, shlex, subprocess
          values = {}
          output = subprocess.check_output(['supabase', 'status', '-o', 'env'], text=True)
          for line in output.splitlines():
              if '=' not in line:
                  continue
              key, value = line.split('=', 1)
              parsed = shlex.split(value)
              values[key] = parsed[0] if parsed else ''
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env:
              env.write('API_URL=' + values['API_URL'] + '\n')
              env.write('ANON_KEY=' + values['ANON_KEY'] + '\n')
              env.write('NESIL_LOCAL_SUPABASE_TEST=1\n')
          PY
      - run: python -m unittest discover -s tests -p test_supabase_local_integration.py -v
